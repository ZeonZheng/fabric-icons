name: Sync Official Microsoft Fabric Icons

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/organized-icon-catalog
    paths:
      - 'scripts/sync-ms-official.py'
      - '.github/workflows/sync-ms-official.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract official ZIP (keep Microsoft folder layout)
        run: python scripts/sync-ms-official.py
      - name: Stage official icons and provenance
        run: |
          git add icons-ms-official/ sources/microsoft-official.json
          git diff --cached --stat
      - name: Commit if changed
        run: |
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: import Microsoft official Fabric diagram icons"
            git push
          fi
